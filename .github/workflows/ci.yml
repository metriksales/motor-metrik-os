name: CI

on:
  push:
    branches: [main, 'docs/**']
  pull_request:
  workflow_dispatch:

# Uma rodada por branch: push novo cancela a anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres de verdade para os testes de isolamento entre contas (S-006).
    # Sem ele, os testes que precisam de banco são pulados.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metrik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metrik_test
      # A mesma base, pelo papel RESTRITO da aplicação (S-046 parte 2). É o que
      # permite exercitar em CI o modo em que a produção vai rodar: sem isto,
      # a parte 2 só seria testada depois de estar no ar.
      TEST_DATABASE_URL_APP: postgres://metrik_app:app_de_teste@localhost:5432/metrik_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Typecheck (todos os projetos)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrar o banco de teste
        run: npm run db:migrate --workspace @motor/db
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # A migração 0012 cria `metrik_app` como NOLOGIN — ele existe só para o
      # `SET LOCAL ROLE`. Para testar a conexão da parte 2 ele precisa logar.
      # A senha é fixa e pública de propósito: é um Postgres descartável que
      # vive dentro da execução e só escuta em localhost.
      - name: Dar login ao papel da aplicação
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE metrik_app WITH LOGIN PASSWORD 'app_de_teste'"

      - name: Testes
        run: npm test

      - name: Build do front + funções
        run: npm run build:web
